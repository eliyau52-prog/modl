name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install llama-cpp-python --prefer-binary --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          pip install pywebview faster-whisper pyinstaller

      - name: Build EXE
        run: >
          pyinstaller app.py
          --name Transcriber
          --noconsole
          --onedir
          --add-data "web;web"
          --collect-all faster_whisper
          --collect-all ctranslate2
          --collect-all llama_cpp
          --collect-all av
          --collect-all tokenizers
          --noconfirm

      - name: Zip
        run: Compress-Archive -Path dist\Transcriber -DestinationPath Transcriber-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Transcriber-windows
          path: Transcriber-windows.zip

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Transcriber-windows.zip
